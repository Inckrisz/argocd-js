apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-b
  namespace: argo
spec:
  project: default
  source:
    repoURL: https://github.com/Inckrisz/argocd-js.git
    targetRevision: helming2
    chart: app2
    path: docs
    helm:
     valueFiles:
      - values.yaml
  destination:
   server: https://kubernetes.default.svc
   namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
